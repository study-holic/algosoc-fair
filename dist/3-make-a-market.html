<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src 'none'">
<title>Make a Market · UoM AlgoSoc</title>
<style>
/* UoM AlgoSoc fair games: shared visual system.
   Sizing is in rem, and the root size tracks the viewport, so 1366x768 and
   1920x1080 get the same layout (16px and 22.5px per rem). */
:root {
  --bg: #1e2429;          /* matches the logo background exactly */
  --panel: #252b31;
  --panel-2: #2c333a;
  --line: #3a424b;
  --line-soft: #2f363d;
  --text: #e6e6e6;
  --muted: #9a9a9a;
  --dim: #6b7178;
  --green: #3fb96b;
  --red: #e5534b;
  --amber: #f0a830;
  --mono: Consolas, Menlo, ui-monospace, "Cascadia Mono", "SF Mono", monospace;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html { font-size: min(calc(100vh / 48), calc(100vw / 85)); }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
body { font-family: var(--sans); font-size: 1.15rem; line-height: 1.35; -webkit-font-smoothing: antialiased; user-select: none; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
.mono, .num, table.data td, table.data th { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { text-align: right; white-space: nowrap; }
.label { font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.pos { color: var(--green); }
.neg { color: var(--red); }
.amber { color: var(--amber); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; }

/* App shell */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.topbar { height: 3.2rem; flex: none; display: flex; align-items: center; gap: 1.2rem; padding: 0 1.6rem; border-bottom: 1px solid var(--line); }
.topbar .brand { display: flex; align-items: center; gap: 0.8rem; }
.topbar .brand .logo-crop { width: 2.2rem; height: 2.2rem; }
.topbar .sep { width: 1px; height: 1.4rem; background: var(--line); }
.topbar .status { margin-left: auto; display: flex; gap: 2rem; align-items: center; font-family: var(--mono); font-size: 1.1rem; }
.screens { position: relative; flex: 1; min-height: 0; }
.screen { position: absolute; inset: 0; padding: 1.4rem 1.6rem; opacity: 0; visibility: hidden; transition: opacity 120ms linear, visibility 0s linear 120ms; display: flex; flex-direction: column; min-height: 0; }
.screen.active { opacity: 1; visibility: visible; transition: opacity 120ms linear, visibility 0s; }

/* Logo: the source image is square with wide margins, so it is cropped here */
.logo-crop { position: relative; overflow: hidden; flex: none; }
.logo-crop img { position: absolute; width: 156%; left: -27.3%; top: -30.9%; max-width: none; }
/* Soft mask so the logo's own background vignette never shows as a box edge. */
.logo-crop { -webkit-mask-image: radial-gradient(closest-side, #000 88%, transparent 100%); mask-image: radial-gradient(closest-side, #000 88%, transparent 100%); }
/* Mark only (no wordmark), for small sizes */
.logo-mark { -webkit-mask-image: none; mask-image: none; }
.logo-crop.logo-mark img { width: 420%; left: -160%; top: -123.8%; }

/* Buttons: big hit areas, hairline borders */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; min-height: 3.2rem; padding: 0 1.4rem; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; cursor: pointer; font-family: var(--mono); font-size: 1.15rem; letter-spacing: 0.04em; transition: background 80ms linear, border-color 80ms linear; }
.btn:hover { background: var(--panel-2); border-color: var(--muted); }
.btn.primary, .btn:focus-visible { border-color: var(--amber); outline: none; }
.btn.primary { color: var(--amber); }
.btn .key { font-size: 0.8rem; color: var(--muted); border: 1px solid var(--line); padding: 0.05rem 0.4rem; border-radius: 2px; }
.btn.buy.on { background: rgba(63,185,107,0.16); border-color: var(--green); color: var(--green); }
.btn.sell.on { background: rgba(229,83,75,0.16); border-color: var(--red); color: var(--red); }
.btn.flat.on { background: var(--panel-2); border-color: var(--text); }

/* Attract */
.attract { display: grid; grid-template-columns: 1fr 1.05fr; grid-template-rows: 1fr auto; gap: 1.2rem 3rem; }
.attract .left { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.attract .left .logo-crop { width: 10.5rem; height: 10.5rem; margin-bottom: 0.4rem; margin-left: -0.6rem; }
.attract h1 { font-size: 3.6rem; line-height: 1.05; margin: 0.6rem 0 0.8rem; font-weight: 600; letter-spacing: -0.01em; }
.attract .pitch { font-size: 1.6rem; color: var(--text); margin: 0 0 2rem; max-width: 30rem; }
.attract .cta { align-self: flex-start; font-size: 1.5rem; min-height: 4.2rem; padding: 0 2rem; }
.attract .others { margin-top: 1.4rem; font-size: 1rem; color: var(--muted); }
.attract .others b { color: var(--text); font-weight: 600; }
.attract .right { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.attract .ticker { grid-column: 1 / -1; height: 7rem; border-top: 1px solid var(--line); position: relative; }
.attract .ticker canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cta-blink { animation: none; }

/* Leaderboard tables */
table.data { width: 100%; border-collapse: collapse; font-size: 1.15rem; }
table.data th { font-family: var(--sans); font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--line); }
table.data th.num { text-align: right; }
table.data td { padding: 0.36rem 0.7rem; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
table.data td.name { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; max-width: 12rem; }
table.data td.rank { color: var(--muted); width: 3rem; }
table.data tr.me td { background: rgba(240,168,48,0.10); }
table.data tr.me td.rank { color: var(--amber); }
table.data tr.empty td { color: var(--dim); }
.lb-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem; }

/* How to play */
.howto { justify-content: center; align-items: center; }
.howto .box { width: min(54rem, 100%); padding: 2.4rem 2.8rem; }
.howto h2 { font-size: 2.4rem; margin: 0.4rem 0 1.4rem; font-weight: 600; }
.howto ol { margin: 0 0 1.6rem; padding: 0; list-style: none; counter-reset: s; }
.howto li { counter-increment: s; font-size: 1.55rem; margin: 0 0 0.9rem; padding-left: 2.6rem; position: relative; }
.howto li::before { content: counter(s); position: absolute; left: 0; top: 0.1rem; font-family: var(--mono); font-size: 1.1rem; color: var(--muted); border: 1px solid var(--line); width: 1.8rem; text-align: center; }
.howto .example { border-left: 2px solid var(--line); padding: 0.6rem 1.2rem; font-size: 1.3rem; color: var(--muted); margin-bottom: 2rem; }
.howto .example .label { display: block; margin-bottom: 0.3rem; }
.howto .example b { color: var(--text); font-weight: 600; }

/* Countdown overlay */
.countdown { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
.countdown span { font-family: var(--mono); font-size: 9rem; color: var(--amber); background: var(--bg); border: 1px solid var(--line); padding: 0 3rem; border-radius: 2px; }

/* Results */
.results { display: grid; grid-template-columns: 1fr 25rem; gap: 2rem; }
.results .detail { min-height: 0; display: flex; flex-direction: column; }
.results .side { display: flex; flex-direction: column; gap: 1rem; min-height: 0; }
.results .score-big { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 3.6rem; line-height: 1; margin-top: 0.3rem; }
.results .rank-line { font-size: 1.2rem; min-height: 1.6rem; }
.results .rank-line.hi { color: var(--amber); font-weight: 600; }
.nick { display: flex; gap: 0.6rem; }
.nick input { flex: 1; min-width: 0; height: 3.2rem; background: var(--bg); border: 1px solid var(--amber); border-radius: 2px; padding: 0 0.9rem; font-family: var(--mono); font-size: 1.4rem; outline: none; user-select: text; }
.nick input::placeholder { color: var(--dim); }
.nick-msg { font-size: 1rem; color: var(--muted); min-height: 1.3rem; }
.takeaway { font-size: 1.2rem; border-left: 2px solid var(--line); padding-left: 1rem; }
.qr { display: flex; gap: 1rem; align-items: center; margin-top: auto; }
.qr img { width: 9.5rem; height: 9.5rem; image-rendering: pixelated; border-radius: 0; flex: none; }
.qr .cap { font-size: 1.05rem; color: var(--text); }
.qr .cap .label { display: block; margin-bottom: 0.3rem; }
.seed { font-family: var(--mono); font-size: 0.75rem; color: var(--dim); }

/* Charts */
.chartbox { position: relative; min-height: 0; }
.chartbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.timebar { height: 0.35rem; background: var(--line-soft); position: relative; overflow: hidden; }
.timebar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--amber); width: 100%; }
.kv { display: flex; flex-direction: column; gap: 0.1rem; }
.kv .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 1.9rem; line-height: 1.15; }
.k { font-family: var(--mono); font-size: 0.85em; border: 1px solid var(--line); padding: 0 0.35rem; margin: 0 0.1rem; color: var(--muted); border-radius: 2px; white-space: nowrap; }
.btn.big { min-height: 4.4rem; font-size: 1.6rem; letter-spacing: 0.08em; }

.g3 { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 30rem; gap: 1.6rem; }
.g3-left { display: flex; flex-direction: column; gap: 1rem; min-height: 0; }
.g3-info { display: grid; grid-template-columns: 1fr 1fr 1fr; }
.g3-info .right { text-align: right; }
.g3-dice { display: flex; gap: 1.6rem; justify-content: center; margin-top: 0.4rem; }
.die-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
.die { width: 7.6rem; height: 7.6rem; border: 1px solid var(--line); background: var(--panel); border-radius: 2px; display: flex; align-items: center; justify-content: center; }
.die span { font-family: var(--mono); font-size: 2.8rem; color: var(--dim); }
.die.up { background: var(--text); border-color: var(--text); }
.pips { display: grid; grid-template-columns: repeat(3, 1.4rem); grid-template-rows: repeat(3, 1.4rem); gap: 0.5rem; }
.pips i { display: block; border-radius: 50%; }
.pips i.on { background: var(--bg); }
.die-cap { font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); height: 1rem; }
.g3-ev { text-align: center; font-size: 1.2rem; color: var(--muted); }
.g3-ev b { color: var(--text); }
.g3-quotebox { display: grid; grid-template-columns: 1fr 1fr 0.7fr; border: 1px solid var(--line); }
.g3-q { display: flex; flex-direction: column; align-items: center; padding: 0.7rem 0 0.5rem; border-right: 1px solid var(--line); }
.g3-q:last-child { border-right: 0; }
.g3-px { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 3.4rem; line-height: 1.1; }
.g3-q.small .g3-px { font-size: 2.2rem; line-height: 1.7; color: var(--muted); }
.g3.quoting .g3-quotebox { border-color: var(--amber); }
.g3-controls { display: grid; grid-template-columns: repeat(4, 1fr) 1.6fr; gap: 0.8rem; }
.g3-controls .btn { min-height: 3.8rem; }
.g3-right { display: flex; flex-direction: column; padding: 1rem 1.2rem; min-height: 0; }
.g3-log { flex: 1; margin-top: 0.6rem; overflow: hidden; font-family: var(--mono); font-size: 1.1rem; }
.g3-log .ln { padding: 0.45rem 0; border-bottom: 1px solid var(--line-soft); display: flex; gap: 0.8rem; align-items: baseline; }
.g3-log .ln .q { color: var(--dim); font-size: 0.85rem; width: 1.6rem; flex: none; }
.g3-log .ln .r { margin-left: auto; }
.g3-log .ln.settle { font-family: var(--sans); color: var(--text); }
.g3-log .ln.sum { font-family: var(--sans); font-weight: 600; border-bottom: 0; border-top: 1px solid var(--line); margin-top: 0.4rem; }
.g3-log .ln.sum .r { font-family: var(--mono); font-size: 1.4rem; }
.g3-foot { border-top: 1px solid var(--line-soft); padding-top: 0.6rem; font-size: 1.1rem; min-height: 2rem; }
.g3-lesson { margin-top: 1.6rem; font-size: 1.25rem; max-width: 46rem; }
.g3-lesson p { margin: 0.6rem 0 0; }
.g3-who { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; font-size: 1.05rem; color: var(--muted); border-top: 1px solid var(--line-soft); padding-top: 0.8rem; }
.g3-who .label { display: block; margin-bottom: 0.2rem; color: var(--text); }
.g3-who i { font-style: normal; color: var(--text); text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.85em; }

</style>
</head>

      }
    }, true);
    root.addEventListener('pointerdown', touch, true);
    root.addEventListener('wheel', touch, { passive: true, capture: true });
    root.addEventListener('pointermove', (e) => {
      if (lastPtr && Math.abs(e.clientX - lastPtr[0]) + Math.abs(e.clientY - lastPtr[1]) > 6) touch();
      lastPtr = [e.clientX, e.clientY];
    }, true);
    setInterval(() => {
      if (app.state !== 'attract' && performance.now() - lastInput > (CFG.IDLE_SECONDS || 25) * 1000) goAttract();
    }, 250);

    goAttract();
    return app;
  }

  root.AS = { config, fmt, esc, store, Leaderboard, cleanName, isProfane, createApp, mobile: root.AS_TARGET === 'mobile' };
})(this);

/* ---- games/make-a-market/logic.js ---- */
/* Game 3 rules, shared with scripts/sim_game3.js. */
(function (root) {
  'use strict';
  /* Trades against one quote. The informed trader compares its fair value with
     the quote; an uninformed customer trades with probability 1 - spread/div.
     Each trade is from the counterparty's side: 'buy' means they bought from you. */
  function tradesOnQuote(rng, bid, ask, fairValue, div) {
    const out = [];
    if (fairValue > ask) out.push({ who: 'informed', side: 'buy', price: ask });
    else if (fairValue < bid) out.push({ who: 'informed', side: 'sell', price: bid });
    else out.push({ who: 'informed', side: 'pass' });
    const spread = ask - bid;
    if (rng.next() < 1 - spread / div) {
      const side = rng.next() < 0.5 ? 'buy' : 'sell';
      out.push({ who: 'customer', side, price: side === 'buy' ? ask : bid });
    } else out.push({ who: 'customer', side: 'pass' });
    return out;
  }
  /* Your PnL on one trade once the asset settles at `total`. */
  function tradePnl(t, total) {
    if (t.side === 'buy') return t.price - total;   // you sold to them
    if (t.side === 'sell') return total - t.price;  // you bought from them
    return 0;
  }
  const api = { tradesOnQuote, tradePnl };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.G3Logic = api;
})(this);

/* ---- games/make-a-market/game.js ---- */
/* Game 3: Make a Market. */
(function () {
  'use strict';
  /*CONFIG*/
  const CONFIG = AS.config({
    IDLE_SECONDS: 25,
    ROUNDS: 3,
    QUOTE_SECONDS: 8,        // each quote auto-submits after this
    START_MID: 10.5,
    START_SPREAD: 2,
    STEP: 0.5,               // Up/Down move the mid by this
    SPREAD_STEP: 1,          // Left/Right change the spread by this (each side moves 0.5)
    SPREAD_MIN: 1,
    SPREAD_MAX: 6,
    MID_MIN: 3,
    MID_MAX: 18,
    CUSTOMER_DIV: 7,         // customer trades with probability 1 - spread / 7
    INFORMED_Q1_ADD: 7,      // informed fair value, quote 1: one die + 7
    INFORMED_Q2_ADD: 3.5,    // quote 2: two dice + 3.5
    TRADES_PAUSE_MS: 2600,   // time to read the trades before the next step
    SETTLE_MS: 6000,         // settlement screen, or press Space
    TEXT: {
      title: 'Make a Market',
      pitch: 'Quote a price. Someone who knows more than you will trade against it.',
      howto: [
        'Three dice are rolled face down. At the end they pay their total: 3 to 18, 10.5 on average.',
        'Bid: the price you buy at. Ask: the price you sell at. <span class="k">↑</span><span class="k">↓</span> move both, <span class="k">←</span><span class="k">→</span> narrow or widen.',
        'A trader who has seen one die, and a customer who has not, may trade with you.',
      ],
      howtoMobile: [
        'Three dice are rolled face down. At the end they pay their total: 3 to 18, 10.5 on average.',
        'Bid: the price you buy at. Ask: the price you sell at. Use the buttons to move and size your quote.',
        'A trader who has seen one die, and a customer who has not, may trade with you.',
      ],
      example: 'You quote <b>9.5 / 11.5</b>. The trader sees a 6 and buys from you at 11.5. The dice total 14, so you lose <b class="neg">2.5</b>.',
      takeaway: 'Tight quotes earn from customers and lose to traders who know more. That is adverse selection, and it is how market makers think.',
    },
  });
  /*END CONFIG*/

  const L = G3Logic, fmt = AS.fmt;
  const WHO = { informed: 'Informed trader', customer: 'Customer' };
  const f1 = (v) => v.toFixed(1);
  let el, ctx, rng, round, quote, dice, mid, spread, trades, phase, t0, timer, pause, totalPnl, roundsOut;

  const html = `
    <div class="g3">
      <div class="g3-left">
        <div class="g3-info">
          <div class="kv"><span class="label">Round</span><span class="v" id="g3-round">1/3</span></div>
          <div class="kv"><span class="label">Quote</span><span class="v" id="g3-quote">1/2</span></div>
          <div class="kv right"><span class="label">Total PnL</span><span class="v" id="g3-total">0.0</span></div>
        </div>
        <div class="g3-dice" id="g3-dice"></div>
        <div class="g3-ev mono" id="g3-ev"></div>
        <div class="g3-quotebox">
          <div class="g3-q"><span class="label">Bid · you buy</span><span class="g3-px" id="g3-bid">9.5</span></div>
          <div class="g3-q"><span class="label">Ask · you sell</span><span class="g3-px" id="g3-ask">11.5</span></div>
          <div class="g3-q small"><span class="label">Spread</span><span class="g3-px" id="g3-spread">2.0</span></div>
        </div>
        <div class="g3-controls">
          <button class="btn" data-a="up" tabindex="-1">Up <span class="key">↑</span></button>
          <button class="btn" data-a="down" tabindex="-1">Down <span class="key">↓</span></button>
          <button class="btn" data-a="narrow" tabindex="-1">Narrow <span class="key">←</span></button>
          <button class="btn" data-a="widen" tabindex="-1">Widen <span class="key">→</span></button>
          <button class="btn primary" data-a="submit" tabindex="-1" id="g3-submit">Submit <span class="key">Enter</span></button>
        </div>
        <div class="timebar"><i id="g3-bar"></i></div>
        <div class="g3-who">
          <div><span class="label">Informed trader</span>Has seen the dice marked <i>trader saw</i>. Trades only when your price is wrong.</div>
          <div><span class="label">Customer</span>Knows nothing. Trades less often when your spread is wide.</div>
        </div>
      </div>
      <div class="g3-right panel">
        <div class="label">Trades this round</div>
        <div class="g3-log" id="g3-log"></div>
        <div class="g3-foot" id="g3-foot"></div>
      </div>
    </div>`;

  function mount(root) {
    el = root;
    el.querySelectorAll('.g3-controls .btn').forEach((b) => b.addEventListener('pointerdown', (e) => { e.preventDefault(); act(b.dataset.a); }));
  }

  function prepare(c) {
    ctx = c; rng = c.rng;
    round = 0; totalPnl = 0; roundsOut = [];
    mid = CONFIG.START_MID; spread = CONFIG.START_SPREAD;
    phase = 'idle';
    newRound();
  }

  function start() { beginQuote(); }

  function newRound() {
    dice = [rng.int(1, 6), rng.int(1, 6), rng.int(1, 6)];
    quote = 0; trades = [];
    renderDice([false, false, false]);
    document.getElementById('g3-log').innerHTML = '';
    document.getElementById('g3-foot').innerHTML = '';
    updateHud();
  }

  const bid = () => mid - spread / 2;
  const ask = () => mid + spread / 2;

  function pips(n) {
    const on = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] }[n];
    let h = '';
    for (let i = 0; i < 9; i++) h += `<i class="${on.includes(i) ? 'on' : ''}"></i>`;
    return `<div class="pips">${h}</div>`;
  }
  // shown: which dice the player can see. Die 0 is the informed trader's; die 1 is revealed after quote 1.
  function renderDice(shown) {
    const seen = quote === 0 ? [true, false, false] : [true, true, false];
    const settled = shown.every(Boolean);
    document.getElementById('g3-dice').innerHTML = dice.map((d, i) => `
      <div class="die-wrap">
        <div class="die ${shown[i] ? 'up' : ''}">${shown[i] ? pips(d) : '<span>?</span>'}</div>
        <div class="die-cap">${i === 1 && shown[1] && !settled ? 'Revealed' : seen[i] || (settled && i < 2) ? 'Trader saw' : ''}</div>
      </div>`).join('');
  }

  function updateHud() {
    const $ = (id) => document.getElementById(id);
    $('g3-round').textContent = `${round + 1}/${CONFIG.ROUNDS}`;
    $('g3-quote').textContent = `${quote + 1}/2`;
    $('g3-bid').textContent = f1(bid());
    $('g3-ask').textContent = f1(ask());
    $('g3-spread').textContent = f1(spread);
    const t = $('g3-total');
    t.textContent = fmt.signed(totalPnl, 1);
    t.className = 'v ' + fmt.cls(totalPnl);
    const S = dice[0] + dice[1] + dice[2], d = dice[1];
    $('g3-ev').innerHTML = phase === 'settle'
      ? `All dice revealed. Total: <b>${S}</b>`
      : AS.mobile   // shorter lines for narrow phone screens
        ? (quote === 0 ? 'Nothing known yet. Expected total <b>10.5</b>' : `One die is ${d}. Expected total <b>${f1(d + 7)}</b>`)
        : (quote === 0 ? 'You know nothing yet. Expected total: <b>10.5</b>' : `You know one die: ${d}. Expected total: ${d} + 7 = <b>${f1(d + 7)}</b>`);
    el.classList.toggle('quoting', phase === 'quote');
  }

  function beginQuote() {
    phase = 'quote';
    t0 = performance.now();
    clearInterval(timer);
    timer = setInterval(() => {
      const t = (performance.now() - t0) / 1000;
      document.getElementById('g3-bar').style.width = Math.max(0, 100 * (1 - t / CONFIG.QUOTE_SECONDS)) + '%';
      if (t >= CONFIG.QUOTE_SECONDS) submit();
    }, 30);
    updateHud();
  }

  function act(a) {
    if (phase === 'settle' && (a === 'submit')) { nextRound(); return; }
    if (phase !== 'quote') return;
    const s = CONFIG.STEP;
    if (a === 'up') mid = Math.min(CONFIG.MID_MAX, mid + s);
    if (a === 'down') mid = Math.max(CONFIG.MID_MIN, mid - s);
    if (a === 'narrow') spread = Math.max(CONFIG.SPREAD_MIN, spread - CONFIG.SPREAD_STEP);
    if (a === 'widen') spread = Math.min(CONFIG.SPREAD_MAX, spread + CONFIG.SPREAD_STEP);
    if (a === 'submit') { submit(); return; }
    updateHud();
  }

  function logLine(t, q) {
    if (t.side === 'pass') return `<div class="ln muted"><span class="q">Q${q}</span><span>${WHO[t.who]} passes</span></div>`;
    const cls = t.who === 'informed' ? 'inf' : '';
    return `<div class="ln ${cls}"><span class="q">Q${q}</span><span>${WHO[t.who]} ${t.side}s 1 at <b>${f1(t.price)}</b></span></div>`;
  }

  function submit() {
    if (phase !== 'quote') return;
    phase = 'show';
    clearInterval(timer);
    document.getElementById('g3-bar').style.width = '0%';
    const fv = quote === 0 ? dice[0] + CONFIG.INFORMED_Q1_ADD : dice[0] + dice[1] + CONFIG.INFORMED_Q2_ADD;
    const tr = L.tradesOnQuote(rng, bid(), ask(), fv, CONFIG.CUSTOMER_DIV);
    tr.forEach((t) => { t.q = quote + 1; trades.push(t); });
    document.getElementById('g3-log').insertAdjacentHTML('beforeend', tr.map((t) => logLine(t, quote + 1)).join(''));
    updateFoot();
    updateHud();
    pause = setTimeout(() => {
      if (quote === 0) {
        quote = 1;
        renderDice([false, true, false]);
        beginQuote();
      } else settle();
    }, CONFIG.TRADES_PAUSE_MS);
  }

  function position() {
    return trades.reduce((p, t) => p + (t.side === 'buy' ? -1 : t.side === 'sell' ? 1 : 0), 0);
  }
  function updateFoot() {
    const p = position();
    document.getElementById('g3-foot').innerHTML = `<span class="label">Your position</span> <span class="mono">${p > 0 ? 'long ' + p : p < 0 ? 'short ' + -p : 'flat'}</span>`;
  }

  function settle() {
    phase = 'settle';
    const S = dice[0] + dice[1] + dice[2];
    renderDice([true, true, true]);
    let pnl = 0, lines = '';
    for (const t of trades) {
      if (t.side === 'pass') continue;
      const v = L.tradePnl(t, S);
      pnl += v;
      const you = t.side === 'buy' ? `you sold at ${f1(t.price)}` : `you bought at ${f1(t.price)}`;
      lines += `<div class="ln"><span class="q">Q${t.q}</span><span>${WHO[t.who]}: ${you}</span><span class="r ${fmt.cls(v)}">${fmt.signed(v, 1)}</span></div>`;
    }
    if (!lines) lines = '<div class="ln muted">No trades this round.</div>';
    totalPnl += pnl;
    roundsOut.push({ dice: dice.slice(), total: S, pnl, trades: trades.filter((t) => t.side !== 'pass').length, informed: trades.filter((t) => t.who === 'informed' && t.side !== 'pass').length });
    document.getElementById('g3-log').innerHTML = `
      <div class="ln settle"><span>Dice: ${dice.join(' + ')} = <b>${S}</b>. Every trade settles at ${S}.</span></div>${lines}
      <div class="ln sum"><span>Round PnL</span><span class="r ${fmt.cls(pnl)}">${fmt.signed(pnl, 1)}</span></div>`;
    document.getElementById('g3-foot').innerHTML = `<span class="label">${round + 1 < CONFIG.ROUNDS ? 'Next round' : 'Results'}</span> <span class="mono muted">${AS.mobile ? 'Tap Continue' : 'Space or Enter'}</span>`;
    document.getElementById('g3-submit').innerHTML = 'Continue <span class="key">Enter</span>';
    updateHud();
    pause = setTimeout(nextRound, CONFIG.SETTLE_MS);
  }

  function nextRound() {
    if (phase !== 'settle') return;
    clearTimeout(pause);
    document.getElementById('g3-submit').innerHTML = 'Submit <span class="key">Enter</span>';
    round++;
    if (round >= CONFIG.ROUNDS) return end();
    newRound();
    mid = CONFIG.START_MID;
    beginQuote();
  }

  function onKey(e) {
    const k = e.key;
    const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'narrow', ArrowRight: 'widen', Enter: 'submit', ' ': 'submit' };
    if (!map[k]) return false;
    if (e.repeat && (map[k] === 'submit')) return true;
    act(map[k]);
    return true;
  }

  function end() {
    phase = 'done';
    const score = Math.round(totalPnl * 10) / 10;
    ctx.finish({
      score,
      scoreText: fmt.signed(score, 1),
      subHtml: 'PnL over 3 rounds',
      takeaway: CONFIG.TEXT.takeaway,
      entry: {},
      rounds: roundsOut.slice(),
    });
  }

  function stop() { clearInterval(timer); clearTimeout(pause); phase = 'done'; }

  function renderResults(root, r) {
    const rows = r.rounds.map((x, i) => `<tr><td class="num rank">${i + 1}</td><td class="num">${x.dice.join(' + ')} = ${x.total}</td><td class="num">${x.trades}</td><td class="num">${x.informed}</td><td class="num ${fmt.cls(x.pnl)}">${fmt.signed(x.pnl, 1)}</td></tr>`).join('');
    root.innerHTML = `
      <div class="label" style="margin-bottom:0.6rem">Your rounds</div>
      <table class="data">
        <thead><tr><th class="num">Round</th><th class="num">Dice</th><th class="num">Trades</th><th class="num">With the informed trader</th><th class="num">PnL</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="g3-lesson">
        <div class="label">What happened</div>
        <p>Customers trade at random, so on average they pay you half the spread.</p>
        <p>The informed trader only trades when your price is wrong, so every trade with it tends to lose.</p>
        <p>A wider spread loses less to the trader but scares customers away. Market makers balance the two.</p>
      </div>`;
  }

  AS.createApp({
    id: 'make-a-market', number: 3, title: CONFIG.TEXT.title, pitch: CONFIG.TEXT.pitch,
    howto: CONFIG.TEXT.howto, howtoMobile: CONFIG.TEXT.howtoMobile, example: CONFIG.TEXT.example, countdown: 0,
    scoreLabel: 'Your PnL', config: CONFIG, gameHtml: html,
    columns: [{ key: 'score', label: 'PnL', fmt: (v) => fmt.signed(v, 1), color: true }],
    game: { mount, prepare, start, stop, onKey, renderResults },
  });
})();

</script>
