<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Beat the Market · UoM AlgoSoc</title>
<style>
/* UoM AlgoSoc fair games: shared visual system.
   Sizing is in rem, and the root size tracks the viewport, so 1366x768 and
   1920x1080 get the same layout (16px and 22.5px per rem). */
:root {
  --bg: #1e2429;          /* matches the logo background exactly */
  --panel: #252b31;
  --panel-2: #2c333a;
  --line: #3a424b;
  --line-soft: #2f363d;
  --text: #e6e6e6;
  --muted: #9a9a9a;
  --dim: #6b7178;
  --green: #3fb96b;
  --red: #e5534b;
  --amber: #f0a830;
  --mono: Consolas, Menlo, ui-monospace, "Cascadia Mono", "SF Mono", monospace;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html { font-size: min(calc(100vh / 48), calc(100vw / 85)); }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
body { font-family: var(--sans); font-size: 1.15rem; line-height: 1.35; -webkit-font-smoothing: antialiased; user-select: none; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
.mono, .num, table.data td, table.data th { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { text-align: right; white-space: nowrap; }
.label { font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.pos { color: var(--green); }
.neg { color: var(--red); }
.amber { color: var(--amber); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; }

/* App shell */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.topbar { height: 3.2rem; flex: none; display: flex; align-items: center; gap: 1.2rem; padding: 0 1.6rem; border-bottom: 1px solid var(--line); }
.topbar .brand { display: flex; align-items: center; gap: 0.8rem; }
.topbar .brand .logo-crop { width: 2.2rem; height: 2.2rem; }
.topbar .sep { width: 1px; height: 1.4rem; background: var(--line); }
.topbar .status { margin-left: auto; display: flex; gap: 2rem; align-items: center; font-family: var(--mono); font-size: 1.1rem; }
.screens { position: relative; flex: 1; min-height: 0; }
.screen { position: absolute; inset: 0; padding: 1.4rem 1.6rem; opacity: 0; visibility: hidden; transition: opacity 120ms linear, visibility 0s linear 120ms; display: flex; flex-direction: column; min-height: 0; }
.screen.active { opacity: 1; visibility: visible; transition: opacity 120ms linear, visibility 0s; }

/* Logo: the source image is square with wide margins, so it is cropped here */
.logo-crop { position: relative; overflow: hidden; flex: none; }
.logo-crop img { position: absolute; width: 156%; left: -27.3%; top: -30.9%; max-width: none; }
/* Soft mask so the logo's own background vignette never shows as a box edge. */
.logo-crop { -webkit-mask-image: radial-gradient(closest-side, #000 88%, transparent 100%); mask-image: radial-gradient(closest-side, #000 88%, transparent 100%); }
/* Mark only (no wordmark), for small sizes */
.logo-mark { -webkit-mask-image: none; mask-image: none; }
.logo-crop.logo-mark img { width: 420%; left: -160%; top: -123.8%; }

/* Buttons: big hit areas, hairline borders */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; min-height: 3.2rem; padding: 0 1.4rem; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; cursor: pointer; font-family: var(--mono); font-size: 1.15rem; letter-spacing: 0.04em; transition: background 80ms linear, border-color 80ms linear; }
.btn:hover { background: var(--panel-2); border-color: var(--muted); }
.btn.primary, .btn:focus-visible { border-color: var(--amber); outline: none; }
.btn.primary { color: var(--amber); }
.btn .key { font-size: 0.8rem; color: var(--muted); border: 1px solid var(--line); padding: 0.05rem 0.4rem; border-radius: 2px; }
.btn.buy.on { background: rgba(63,185,107,0.16); border-color: var(--green); color: var(--green); }
.btn.sell.on { background: rgba(229,83,75,0.16); border-color: var(--red); color: var(--red); }
.btn.flat.on { background: var(--panel-2); border-color: var(--text); }

/* Attract */
.attract { display: grid; grid-template-columns: 1fr 1.05fr; grid-template-rows: 1fr auto; gap: 1.2rem 3rem; }
.attract .left { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.attract .left .logo-crop { width: 10.5rem; height: 10.5rem; margin-bottom: 0.4rem; margin-left: -0.6rem; }
.attract h1 { font-size: 3.6rem; line-height: 1.05; margin: 0.6rem 0 0.8rem; font-weight: 600; letter-spacing: -0.01em; }
.attract .pitch { font-size: 1.6rem; color: var(--text); margin: 0 0 2rem; max-width: 30rem; }
.attract .cta { align-self: flex-start; font-size: 1.5rem; min-height: 4.2rem; padding: 0 2rem; }
.attract .others { margin-top: 1.4rem; font-size: 1rem; color: var(--muted); }
.attract .others b { color: var(--text); font-weight: 600; }
.attract .right { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.attract .ticker { grid-column: 1 / -1; height: 7rem; border-top: 1px solid var(--line); position: relative; }
.attract .ticker canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cta-blink { animation: none; }

/* Leaderboard tables */
table.data { width: 100%; border-collapse: collapse; font-size: 1.15rem; }
table.data th { font-family: var(--sans); font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--line); }
table.data th.num { text-align: right; }
table.data td { padding: 0.36rem 0.7rem; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
table.data td.name { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; max-width: 12rem; }
table.data td.rank { color: var(--muted); width: 3rem; }
table.data tr.me td { background: rgba(240,168,48,0.10); }
table.data tr.me td.rank { color: var(--amber); }
table.data tr.empty td { color: var(--dim); }
.lb-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem; }

/* How to play */
.howto { justify-content: center; align-items: center; }
.howto .box { width: min(54rem, 100%); padding: 2.4rem 2.8rem; }
.howto h2 { font-size: 2.4rem; margin: 0.4rem 0 1.4rem; font-weight: 600; }
.howto ol { margin: 0 0 1.6rem; padding: 0; list-style: none; counter-reset: s; }
.howto li { counter-increment: s; font-size: 1.55rem; margin: 0 0 0.9rem; padding-left: 2.6rem; position: relative; }
.howto li::before { content: counter(s); position: absolute; left: 0; top: 0.1rem; font-family: var(--mono); font-size: 1.1rem; color: var(--muted); border: 1px solid var(--line); width: 1.8rem; text-align: center; }
.howto .example { border-left: 2px solid var(--line); padding: 0.6rem 1.2rem; font-size: 1.3rem; color: var(--muted); margin-bottom: 2rem; }
.howto .example .label { display: block; margin-bottom: 0.3rem; }
.howto .example b { color: var(--text); font-weight: 600; }

/* Countdown overlay */
.countdown { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
.countdown span { font-family: var(--mono); font-size: 9rem; color: var(--amber); background: var(--bg); border: 1px solid var(--line); padding: 0 3rem; border-radius: 2px; }

/* Results */
.results { display: grid; grid-template-columns: 1fr 25rem; gap: 2rem; }
.results .detail { min-height: 0; display: flex; flex-direction: column; }
.results .side { display: flex; flex-direction: column; gap: 1rem; min-height: 0; }
.results .score-big { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 3.6rem; line-height: 1; margin-top: 0.3rem; }
.results .rank-line { font-size: 1.2rem; min-height: 1.6rem; }
.results .rank-line.hi { color: var(--amber); font-weight: 600; }
.nick { display: flex; gap: 0.6rem; }
.nick input { flex: 1; min-width: 0; height: 3.2rem; background: var(--bg); border: 1px solid var(--amber); border-radius: 2px; padding: 0 0.9rem; font-family: var(--mono); font-size: 1.4rem; outline: none; user-select: text; }
.nick input::placeholder { color: var(--dim); }
.nick-msg { font-size: 1rem; color: var(--muted); min-height: 1.3rem; }
.takeaway { font-size: 1.2rem; border-left: 2px solid var(--line); padding-left: 1rem; }
.qr { display: flex; gap: 1rem; align-items: center; margin-top: auto; }
.qr img { width: 9.5rem; height: 9.5rem; image-rendering: pixelated; border-radius: 0; flex: none; }
.qr .cap { font-size: 1.05rem; color: var(--text); }
.qr .cap .label { display: block; margin-bottom: 0.3rem; }
.seed { font-family: var(--mono); font-size: 0.75rem; color: var(--dim); }

/* Charts */
.chartbox { position: relative; min-height: 0; }
.chartbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.timebar { height: 0.35rem; background: var(--line-soft); position: relative; overflow: hidden; }
.timebar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--amber); width: 100%; }
.kv { display: flex; flex-direction: column; gap: 0.1rem; }
.kv .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 1.9rem; line-height: 1.15; }
.k { font-family: var(--mono); font-size: 0.85em; border: 1px solid var(--line); padding: 0 0.35rem; margin: 0 0.1rem; color: var(--muted); border-radius: 2px; white-space: nowrap; }
.btn.big { min-height: 4.4rem; font-size: 1.6rem; letter-spacing: 0.08em; }

.g1 { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.8rem; }
.g1 .stats { display: grid; grid-template-columns: 1.1fr 1.2fr 1fr 0.8fr; gap: 1rem; }
.g1 .stats .right { text-align: right; }
.g1 .stats .v { font-size: 2.4rem; }
.g1 .chartbox { flex: 1; border: 1px solid var(--line); background: var(--bg); }
.g1 .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
.g1-vs td:first-child { font-family: var(--sans); }
.results .replay-head { display: flex; justify-content: space-between; align-items: baseline; margin: 1.4rem 0 0.4rem; }
.results .legend { font-family: var(--mono); font-size: 0.95rem; color: var(--muted); }

/* Phone layer (docs/ build only). Loaded after base.css and each game's game.css.
   The laptop build scales rem with the viewport; phones use a fixed, readable rem instead. */
html { font-size: clamp(14px, 4.1vw, 17px); }
html, body { overscroll-behavior: none; }
body.m { font-size: 1rem; -webkit-tap-highlight-color: transparent; }
.m .key, .m .g2-key, .m .g4-keys { display: none; }
.m .btn { min-height: 3rem; touch-action: manipulation; font-size: 1rem; padding: 0 0.9rem; }
.m .btn.big { min-height: 3.6rem; font-size: 1.15rem; }
.m a.btn { text-decoration: none; color: var(--text); }
.m a.btn.primary { color: var(--amber); }

/* Top bar: mark, game name, back link */
.m .topbar { height: 3.2rem; padding: 0 0.9rem; gap: 0.7rem; }
.m .topbar .brand .logo-crop { width: 2rem; height: 2rem; }
.m .m-title { color: var(--text); letter-spacing: 0.14em; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m .m-back { margin-left: auto; color: var(--text); font-size: 0.9rem; text-decoration: none; border: 1px solid var(--line); border-radius: 2px; padding: 0 0.8rem; min-height: 2.75rem; display: inline-flex; align-items: center; white-space: nowrap; touch-action: manipulation; }

/* Screens: the game screen never scrolls; how-to and results scroll naturally if needed */
.m .screen { padding: 0.8rem 0.9rem; }
.m .screen.howto, .m .screen.results { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.m .screen.game { overflow: hidden; touch-action: manipulation; }
.m .countdown span { font-size: 6rem; padding: 0 2rem; }

/* How to play */
.m .howto { justify-content: flex-start; align-items: stretch; }
.m .howto .box { width: 100%; padding: 0.4rem 0 1rem; }
.m .howto h2 { font-size: 1.9rem; margin: 0.3rem 0 1rem; }
.m .howto li { font-size: 1.1rem; padding-left: 2.1rem; margin-bottom: 0.8rem; }
.m .howto li::before { font-size: 0.85rem; width: 1.5rem; }
.m .howto .example { font-size: 1rem; margin-bottom: 1.3rem; }
.m .m-start { width: 100%; }

/* Results: stacked, current result first */
.m .results { display: flex; flex-direction: column; gap: 0.9rem; }
.m .m-card { border: 1px solid var(--line); background: var(--panel); padding: 0.9rem 1rem; border-radius: 2px; }
.m .m-game { color: var(--text); margin-bottom: 0.6rem; }
.m .results .score-big { font-size: 3rem; margin-top: 0.2rem; }
.m .m-sub { margin-top: 0.3rem; font-size: 1rem; }
.m .m-finished { margin-top: 0.6rem; font-size: 1.1rem; color: var(--text); border-top: 1px solid var(--line-soft); padding-top: 0.6rem; }
.m .m-prize { border: 1px solid var(--amber); color: var(--text); padding: 0.8rem 1rem; font-size: 1.05rem; border-radius: 2px; }
.m .m-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
.m .takeaway { font-size: 1.05rem; }
.m .m-join { width: 100%; color: var(--text); }
.m .results .detail { display: block; padding-top: 0.4rem; border-top: 1px solid var(--line); }
.m .results .detail .chartbox { height: 15rem; flex: none !important; }
.m table.data { font-size: 0.9rem; }
.m table.data th { font-size: 0.65rem; letter-spacing: 0.12em; padding: 0.4rem 0.35rem; }
.m table.data td { padding: 0.35rem; white-space: normal; }
.m table.data td.num { white-space: nowrap; }

/* Shared in-game bits */
.m .kv .v { font-size: 1.5rem; }
.m .label { font-size: 0.7rem; letter-spacing: 0.16em; }

/* Phone held sideways: short screens get the laptop-style side-by-side layouts, compacted.
   The game screen may scroll as a last resort so no control is ever unreachable. */
@media (orientation: landscape) and (max-height: 520px) {
  html { font-size: clamp(12px, 3.4vh, 15px); }
  .m .topbar { height: 2.8rem; }
  .m .m-back { min-height: 2.4rem; }
  .m .screen { padding: 0.5rem 0.9rem; }
  .m .screen.game { overflow-y: auto; }
}

/* Phone layout: 2x2 stats, chart fills, three large buttons at the bottom. */
.m .g1 { gap: 0.6rem; }
.m .g1 .stats { grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem; }
.m .g1 .stats .kv:nth-child(2), .m .g1 .stats .kv:nth-child(4) { text-align: right; }
.m .g1 .stats .v { font-size: 1.6rem; }
.m .g1 .chartbox { min-height: 12rem; }
.m .g1 .actions { gap: 0.5rem; }
.m .g1 .actions .btn.big { min-height: 4.2rem; font-size: 1.2rem; letter-spacing: 0.06em; padding: 0; }
.m .results .replay-head { flex-wrap: wrap; gap: 0.3rem; margin: 1rem 0 0.3rem; }
.m .g1-vs th:nth-child(4), .m .g1-vs td:nth-child(4) { display: none; }
@media (orientation: landscape) and (max-height: 520px) {
  .m .g1 { display: grid; grid-template-columns: 1fr 15rem; grid-template-rows: auto auto 1fr auto; grid-template-areas: "chart stats" "chart bar" "chart ." "chart actions"; gap: 0.5rem 0.9rem; }
  .m .g1 .stats { grid-area: stats; }
  .m .g1 .timebar { grid-area: bar; }
  .m .g1 .chartbox { grid-area: chart; min-height: 0; }
  .m .g1 .actions { grid-area: actions; }
  .m .g1 .actions .btn.big { min-height: 3.6rem; font-size: 1.05rem; }
}

</style>
</head>

      const go = k === ' ' || k === 'Enter';
      if (app.state === 'attract') { if (go) { e.preventDefault(); if (!e.repeat) goHowto(); } return; }
      if (app.state === 'howto') { if (go) { e.preventDefault(); if (!e.repeat) startGame(); } if (k === 'Escape') goAttract(); return; }
      if (app.state === 'game') {
        if (k === 'Escape') { goAttract(); return; }
        if (cdEl) { if ([' ', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault(); return; }
        if (spec.game.onKey(e) || [' ', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
        return;
      }
      if (app.state === 'results') {
        if (!saved) {
          if (k === 'Enter') { e.preventDefault(); saveName(nick.value); }
          else if (k === 'Escape') { e.preventDefault(); saveName('anon'); }
          else if (document.activeElement !== nick && k.length === 1) nick.focus({ preventScroll: true });
          return;
        }
        if ((go || k === 'Escape') && !e.repeat) { e.preventDefault(); goAttract(); }
      }
    }, true);
    root.addEventListener('pointerdown', touch, true);
    root.addEventListener('wheel', touch, { passive: true, capture: true });
    root.addEventListener('pointermove', (e) => {
      if (lastPtr && Math.abs(e.clientX - lastPtr[0]) + Math.abs(e.clientY - lastPtr[1]) > 6) touch();
      lastPtr = [e.clientX, e.clientY];
    }, true);
    setInterval(() => {
      if (app.state !== 'attract' && performance.now() - lastInput > (CFG.IDLE_SECONDS || 25) * 1000) goAttract();
    }, 250);

    goAttract();
    return app;
  }

  root.AS = { config, fmt, esc, store, Leaderboard, cleanName, isProfane, createApp, mobile: root.AS_TARGET === 'mobile' };
})(this);

/* ---- shared/mobile.js ---- */
/* Phone shell for the GitHub Pages build (docs/). Bundled only when AS_TARGET = 'mobile'.
   Differences from the laptop shell in core.js:
   - no attract screen, leaderboard, nickname entry or idle reset: phones are personal devices
   - every game gets a fresh random seed; ?seed= is ignored and the seed is never shown
   - the results screen stays up until the player acts, shows the finish time, and tells the
     player to show it to a committee member (the paper sheet is the official leaderboard) */
(function (root) {
  'use strict';
  const AS = root.AS, esc = AS.esc;
  const LINKS = root.AS_LINKS || {};

  function createMobileApp(spec) {
    const CFG = spec.config;
    const A = root.ASSETS || {};
    const $ = (sel) => document.querySelector(sel);
    const app = { spec, config: CFG, state: 'howto', seed: 0, mobile: true };
    root.ASApp = app;
    document.body.classList.add('m');

    const howto = spec.howtoMobile || spec.howto;
    document.getElementById('app').innerHTML = `
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="All games"><div class="logo-crop logo-mark"><img alt="" src="${A.logo || ''}"></div></a>
        <span class="label m-title">${esc(spec.title)}</span>
        <a class="m-back" href="index.html" id="btn-back">All games</a>
      </header>
      <main class="screens">
        <section class="screen howto" id="scr-howto">
          <div class="box">
            <div class="label">How to play · about a minute</div>
            <h2>${esc(spec.title)}</h2>
            <ol>${howto.map((l) => `<li>${l}</li>`).join('')}</ol>
            <div class="example"><span class="label">Example</span>${spec.example}</div>
            <button class="btn primary big m-start" id="btn-start">Start</button>
          </div>
        </section>
        <section class="screen game" id="scr-game"></section>
        <section class="screen results" id="scr-results">
          <div class="m-card">
            <div class="label m-game">${esc(spec.title)}</div>
            <div class="label">${esc(spec.scoreLabel || 'Your score')}</div>
            <div class="score-big" id="res-score"></div>
            <div class="mono muted m-sub" id="res-sub"></div>
            <div class="m-finished mono" id="res-time"></div>
          </div>
          <div class="m-prize" id="res-prize">Want to enter the official prize leaderboard? Show this screen to an AlgoSoc committee member.</div>
          <div class="m-actions">
            <button class="btn primary big" id="btn-again">Play again</button>
            <a class="btn big" href="index.html" id="btn-home">All games</a>
          </div>
          <div class="takeaway" id="res-takeaway"></div>
          <a class="btn big m-join" id="btn-join" href="${esc(LINKS.join || '')}" target="_blank" rel="noopener noreferrer">Follow / join AlgoSoc</a>
          <div class="detail" id="res-detail"></div>
        </section>
      </main>`;
    const screens = { howto: $('#scr-howto'), game: $('#scr-game'), results: $('#scr-results') };
    if (spec.gameHtml) screens.game.innerHTML = spec.gameHtml;
    spec.game.mount(screens.game, app);

    function show(name) {
      app.state = name;
      document.body.dataset.screen = name;
      for (const k in screens) screens[k].classList.toggle('active', k === name);
      screens[name].scrollTop = 0;
    }

    let cdTimer = 0, cdEl = null;
    function clearCountdown() { clearInterval(cdTimer); cdTimer = 0; if (cdEl) { cdEl.remove(); cdEl = null; } }
    function startGame() {
      if (spec.game.stopResults) spec.game.stopResults();
      clearCountdown();
      show('game');
      // Always a fresh seed: prize scores must not be replayable from the URL.
      app.seed = root.ASRng.newSeed();
      const ctx = { seed: app.seed, rng: root.ASRng.makeRng(app.seed), config: CFG, finish, status: () => {} };
      if (spec.game.prepare) spec.game.prepare(ctx);
      const n = spec.countdown || 0;
      if (!n) { spec.game.start(ctx); return; }
      let k = n;
      cdEl = document.createElement('div');
      cdEl.className = 'countdown';
      cdEl.innerHTML = `<span>${k}</span>`;
      screens.game.appendChild(cdEl);
      cdTimer = setInterval(() => {
        k--;
        if (k <= 0) { clearCountdown(); if (app.state === 'game') spec.game.start(ctx); }
        else cdEl.firstChild.textContent = k;
      }, CFG.COUNTDOWN_STEP_MS || 700);
    }

    function finish(result) {
      if (app.state !== 'game') return;
      $('#res-score').innerHTML = `<span class="${result.scoreClass != null ? result.scoreClass : AS.fmt.cls(result.score)}">${esc(result.scoreText)}</span>`;
      $('#res-sub').innerHTML = result.subHtml || '';
      $('#res-time').textContent = 'Finished at ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      $('#res-takeaway').textContent = result.takeaway;
      show('results');
      spec.game.renderResults($('#res-detail'), result);
    }

    $('#btn-start').addEventListener('click', () => { if (app.state === 'howto') startGame(); });
    $('#btn-again').addEventListener('click', () => { if (app.state === 'results') startGame(); });

    // Keyboard stays optional: Enter/Space start, arrows etc. go to the game.
    root.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const k = e.key;
      if (app.state === 'howto' && (k === ' ' || k === 'Enter') && !e.repeat && document.activeElement.tagName !== 'A') { e.preventDefault(); startGame(); return; }
      if (app.state === 'game') {
        if (cdEl) return;
        if (spec.game.onKey(e) || [' ', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
      }
    }, true);

    show('howto');
    return app;
  }

  AS.createMobileApp = createMobileApp;
})(this);

/* ---- games/beat-the-market/game.js ---- */
/* Game 1: Beat the Market. */
(function () {
  'use strict';
  /*CONFIG*/
  const CONFIG = AS.config({
    IDLE_SECONDS: 25,
    COUNTDOWN_SECONDS: 3,
    TICK_MS: 200,            // 5 ticks per second
    DURATION_TICKS: 300,     // 60 seconds
    VISIBLE_TICKS: 120,
    HISTORY_TICKS: 120,      // drawn before the start so the chart is full from the first second
    START_PRICE: 100,
    SIZE: 100,               // shares per position
    COST: 2,                 // pounds per position change
    BOT_FAST: 10,
    BOT_SLOW: 30,
    REPLAY_MS: 2500,
    // Price process (per tick, log returns). Tuned with scripts/sim_game1.js.
    PATH: {
      start: 1, sigma: 0.0012, regimeMin: 40, regimeMax: 80, pTrend: 0.5,
      driftMin: 0.15, driftMax: 0.4, kappaMin: 0.02, kappaMax: 0.08,
      volMin: 0.7, volMax: 1.4, jumpProb: 0.01, jumpMin: 3, jumpMax: 6,
    },
    TEXT: {
      title: 'Beat the Market',
      pitch: '60 seconds. Buy low, sell high. Then see if you beat the bot.',
      howto: [
        '<b>BUY</b> <span class="k">↑</span> to go long: you gain when the price rises.',
        '<b>SELL</b> <span class="k">↓</span> to go short: you gain when it falls. <b>FLAT</b> <span class="k">Space</span> closes.',
        'Each change costs £2. A trading bot plays the same chart.',
      ],
      howtoMobile: [
        'Tap <b>BUY</b> to go long: you gain when the price rises.',
        'Tap <b>SELL</b> to go short: you gain when it falls. <b>FLAT</b> closes.',
        'Each change costs £2. A trading bot plays the same chart.',
      ],
      example: 'Buy at <b>100.00</b>, the price rises to <b>101.50</b>: 100 shares × £1.50 = <b class="pos">+£150</b>, less £2 = <b class="pos">+£148</b>.',
      takeawayBot: 'The bot follows one rule: two moving averages. You build it in Week 3.',
      takeawayPlayer: 'You beat a moving-average bot. Come and build one that beats you.',
    },
  });
  /*END CONFIG*/

  const Ch = ASChart, M = ASMarket, fmt = AS.fmt;
  const H = CONFIG.HISTORY_TICKS, N = CONFIG.DURATION_TICKS;
  const POS_NAME = { '1': 'LONG', '0': 'FLAT', '-1': 'SHORT' };

  let el, ctx, prices, tick, pos, pnl, trades, entryPrice, timer, stopLoop, yLo, yHi, running, stopReplay, bot;

  const html = `
    <div class="g1">
      <div class="stats">
        <div class="kv"><span class="label">Position</span><span class="v" id="g1-pos">FLAT</span></div>
        <div class="kv"><span class="label">Your PnL</span><span class="v" id="g1-pnl">£0.00</span></div>
        <div class="kv"><span class="label">Price</span><span class="v" id="g1-px">100.00</span></div>
        <div class="kv right"><span class="label">Time left</span><span class="v" id="g1-time">60.0</span></div>
      </div>
      <div class="timebar"><i id="g1-bar"></i></div>
      <div class="chartbox" id="g1-chartbox"><canvas id="g1-chart"></canvas></div>
      <div class="actions">
        <button class="btn big buy" data-p="1" tabindex="-1">BUY <span class="key">↑</span></button>
        <button class="btn big flat" data-p="0" tabindex="-1">FLAT <span class="key">Space</span></button>
        <button class="btn big sell" data-p="-1" tabindex="-1">SELL <span class="key">↓</span></button>
      </div>
    </div>`;

  function mount(root) {
    el = root;
    el.querySelectorAll('.actions .btn').forEach((b) => {
      b.addEventListener('pointerdown', (e) => { e.preventDefault(); if (running) setPos(+b.dataset.p); });
    });
  }

  function prepare(c) {
    ctx = c;
    const rng = c.rng;
    const raw = M.regimePath(rng, H + N, CONFIG.PATH);
    const k = CONFIG.START_PRICE / raw[H];
    prices = Array.from(raw, (v) => v * k);
    bot = M.tickBot(prices, CONFIG.BOT_FAST, CONFIG.BOT_SLOW, H, H + N, CONFIG.SIZE, CONFIG.COST);
    tick = H; pos = 0; pnl = 0; trades = []; entryPrice = null; running = false;
    yLo = yHi = null;
    updateHud();
    if (!stopLoop) stopLoop = Ch.loop(draw);
  }

  function start() {
    running = true;
    const t0 = performance.now();
    timer = setInterval(() => {
      const due = Math.min(N, Math.floor((performance.now() - t0) / CONFIG.TICK_MS));
      while (tick - H < due) {
        pnl += pos * CONFIG.SIZE * (prices[tick + 1] - prices[tick]);
        tick++;
      }
      updateHud();
      if (tick - H >= N) end();
    }, Math.min(50, CONFIG.TICK_MS / 2));
  }

  function setPos(p) {
    if (p === pos) return;
    trades.push({ i: tick, price: prices[tick], side: p > pos ? 'buy' : 'sell', pos: p });
    pos = p;
    pnl -= CONFIG.COST;
    entryPrice = p === 0 ? null : prices[tick];
    updateHud();
  }

  function onKey(e) {
    if (!running || e.repeat) return e.key === ' ' || e.key.startsWith('Arrow');
    if (e.key === 'ArrowUp') { setPos(1); return true; }
    if (e.key === 'ArrowDown') { setPos(-1); return true; }
    if (e.key === ' ') { setPos(0); return true; }
    return false;
  }

  function updateHud() {
    const $ = (id) => document.getElementById(id);
    const pe = $('g1-pos');
    pe.textContent = POS_NAME[pos] + (pos ? ' 100' : '');
    pe.className = 'v ' + (pos > 0 ? 'pos' : pos < 0 ? 'neg' : '');
    const pn = $('g1-pnl');
    pn.textContent = fmt.money(pnl);
    pn.className = 'v ' + fmt.cls(pnl);
    $('g1-px').textContent = prices[tick].toFixed(2);
    const left = (N - (tick - H)) * CONFIG.TICK_MS / 1000;
    $('g1-time').textContent = left.toFixed(1);
    $('g1-bar').style.width = (100 * (N - (tick - H)) / N) + '%';
    el.querySelectorAll('.actions .btn').forEach((b) => b.classList.toggle('on', +b.dataset.p === pos));
  }

  function end() {
    clearInterval(timer);
    running = false;
    const won = pnl > bot.pnl;
    ctx.finish({
      score: Math.round(pnl * 100) / 100,
      scoreText: fmt.money(pnl),
      subHtml: `Bot: <span class="${fmt.cls(bot.pnl)}">${fmt.money(bot.pnl)}</span>`,
      takeaway: won ? CONFIG.TEXT.takeawayPlayer : CONFIG.TEXT.takeawayBot,
      entry: { bot: Math.round(bot.pnl * 100) / 100 },
      prices, trades: trades.slice(), bot, won, pnl,
    });
  }

  function stop() {
    clearInterval(timer);
    running = false;
  }

  /* Live chart: most recent VISIBLE_TICKS ticks, y-range eased towards target. */
  function draw() {
    if (!prices || document.body.dataset.screen !== 'game') return;
    const cv = document.getElementById('g1-chart');
    const g = Ch.fit(cv);
    const rem = g.rem, gutter = 5.2 * rem;
    const box = { x0: 0, x1: g.w - gutter, y0: 1.2 * rem, y1: g.h - 1.6 * rem };
    const from = tick - CONFIG.VISIBLE_TICKS + 1, to = tick + 1;
    let [lo, hi] = Ch.pad(Ch.extent([prices], from, to), 0.12);
    const mid = (lo + hi) / 2, half = Math.max((hi - lo) / 2, 0.6);
    lo = mid - half; hi = mid + half;
    if (yLo == null) { yLo = lo; yHi = hi; }
    yLo += (lo - yLo) * 0.15; yHi += (hi - yHi) * 0.15;
    const xs = Ch.scale(from, tick, box.x0 + 0.5 * rem, box.x1 - 1.2 * rem);
    const ys = Ch.scale(yLo, yHi, box.y1, box.y0);
    Ch.grid(g, box, ys, yLo, yHi, { count: 6, decimals: 2, gutter: gutter - 0.6 * rem, fontRem: 0.85 });
    Ch.vline(g, box.x1, box.y0 - rem, box.y1 + rem, Ch.C.line);
    if (entryPrice != null) Ch.hline(g, box.x0, box.x1, ys(entryPrice), pos > 0 ? Ch.C.green : Ch.C.red, [6, 5]);
    Ch.series(g, prices, Math.max(0, from), to, xs, ys, Ch.C.text, 2);
    for (const t of trades) if (t.i >= from) Ch.tri(g, xs(t.i), ys(t.price), t.side === 'buy', t.side === 'buy' ? Ch.C.green : Ch.C.red, true);
    const p = prices[tick];
    Ch.tag(g, p.toFixed(2), box.x1 + 0.2 * rem, ys(p), Ch.C.bg, Ch.C.text);
    Ch.text(g, 'LAST 24 SECONDS', box.x0 + 0.5 * rem, g.h - 0.3 * rem, { size: 0.7, sans: true, spacing: '0.18em' });
  }

  /* ---------- results ---------- */
  function legendTri(up, color, filled) {
    const pts = up ? '6,1 11,10 1,10' : '6,11 11,2 1,2';
    return `<svg width="0.8rem" height="0.8rem" viewBox="0 0 12 12" style="vertical-align:-0.05rem"><polygon points="${pts}" fill="${filled ? color : 'none'}" stroke="${color}" stroke-width="1.5"/></svg>`;
  }

  function renderResults(root, r) {
    const cost = (n) => fmt.money(-n * CONFIG.COST);
    const C = Ch.C.text ? Ch.C : (Ch.loadColors(), Ch.C);
    root.innerHTML = `
      <div class="label" style="margin-bottom:0.6rem">${r.won ? 'You beat the bot' : 'The bot won this one'}</div>
      <table class="data g1-vs">
        <thead><tr><th></th><th class="num">PnL</th><th class="num">Trades</th><th class="num">Costs</th></tr></thead>
        <tbody>
          <tr><td>You</td><td class="num ${fmt.cls(r.pnl)}">${fmt.money(r.pnl)}</td><td class="num">${r.trades.length}</td><td class="num">${cost(r.trades.length)}</td></tr>
          <tr><td>Bot: moving averages ${CONFIG.BOT_FAST}/${CONFIG.BOT_SLOW}</td><td class="num ${fmt.cls(r.bot.pnl)}">${fmt.money(r.bot.pnl)}</td><td class="num">${r.bot.trades.length}</td><td class="num">${cost(r.bot.trades.length)}</td></tr>
        </tbody>
      </table>
      <div class="replay-head">
        <span class="label">Replay: the full 60 seconds</span>
        <span class="legend">${legendTri(true, C.green, true)} ${legendTri(false, C.red, true)} you &nbsp; ${legendTri(true, C.green, false)} ${legendTri(false, C.red, false)} bot</span>
      </div>
      <div class="chartbox" style="flex:1"><canvas id="g1-replay"></canvas></div>`;
    const cv = root.querySelector('#g1-replay');
    const t0 = performance.now();
    if (stopReplay) stopReplay();
    stopReplay = Ch.loop(() => {
      const k = Math.min(1, (performance.now() - t0) / CONFIG.REPLAY_MS);
      const g = Ch.fit(cv);
      const rem = g.rem, gutter = 4.6 * rem;
      const box = { x0: 0, x1: g.w - gutter, y0: 1.6 * rem, y1: g.h - 1.6 * rem };
      const end = H + Math.round(N * k);
      const [lo, hi] = Ch.pad(Ch.extent([r.prices], H, H + N + 1), 0.1);
      const xs = Ch.scale(H, H + N, box.x0 + 0.5 * rem, box.x1 - 0.8 * rem);
      const ys = Ch.scale(lo, hi, box.y1, box.y0);
      Ch.grid(g, box, ys, lo, hi, { count: 5, decimals: 2, gutter: gutter - 0.6 * rem });
      Ch.vline(g, box.x1, box.y0 - rem, box.y1 + rem, Ch.C.line);
      Ch.series(g, r.prices, H, end + 1, xs, ys, Ch.C.text, 1.6);
      for (const t of r.bot.trades) if (t.i <= end) Ch.tri(g, xs(t.i), ys(t.price), t.side === 'buy', t.side === 'buy' ? Ch.C.green : Ch.C.red, false, 0.5 * rem);
      for (const t of r.trades) if (t.i <= end) Ch.tri(g, xs(t.i), ys(t.price), t.side === 'buy', t.side === 'buy' ? Ch.C.green : Ch.C.red, true, 0.5 * rem);
      for (let s = 0; s <= 60; s += 15) Ch.text(g, s + 's', xs(H + s * 5), g.h - 0.2 * rem, { align: s === 0 ? 'left' : s === 60 ? 'right' : 'center', size: 0.75 });
      if (k >= 1 && document.body.dataset.screen !== 'results') { stopReplay(); stopReplay = null; }
    });
  }
  function stopResults() { if (stopReplay) { stopReplay(); stopReplay = null; } }

  AS.createApp({
    id: 'beat-the-market', number: 1, title: CONFIG.TEXT.title, pitch: CONFIG.TEXT.pitch,
    howto: CONFIG.TEXT.howto, howtoMobile: CONFIG.TEXT.howtoMobile, example: CONFIG.TEXT.example, countdown: CONFIG.COUNTDOWN_SECONDS,
    scoreLabel: 'Your PnL', config: CONFIG, gameHtml: html,
    columns: [
      { key: 'score', label: 'PnL', fmt: (v) => fmt.money(v), color: true },
      { key: 'bot', label: 'Bot PnL', fmt: (v) => fmt.money(v), color: true },
    ],
    game: { mount, prepare, start, stop, onKey, renderResults, stopResults },
  });
})();

</script>
