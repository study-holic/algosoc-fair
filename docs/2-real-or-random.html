<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src 'none'">
<title>Real or Random · UoM AlgoSoc</title>
<style>
/* UoM AlgoSoc fair games: shared visual system.
   Sizing is in rem, and the root size tracks the viewport, so 1366x768 and
   1920x1080 get the same layout (16px and 22.5px per rem). */
:root {
  --bg: #1e2429;          /* matches the logo background exactly */
  --panel: #252b31;
  --panel-2: #2c333a;
  --line: #3a424b;
  --line-soft: #2f363d;
  --text: #e6e6e6;
  --muted: #9a9a9a;
  --dim: #6b7178;
  --green: #3fb96b;
  --red: #e5534b;
  --amber: #f0a830;
  --mono: Consolas, Menlo, ui-monospace, "Cascadia Mono", "SF Mono", monospace;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html { font-size: min(calc(100vh / 48), calc(100vw / 85)); }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
body { font-family: var(--sans); font-size: 1.15rem; line-height: 1.35; -webkit-font-smoothing: antialiased; user-select: none; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
.mono, .num, table.data td, table.data th { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { text-align: right; white-space: nowrap; }
.label { font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.pos { color: var(--green); }
.neg { color: var(--red); }
.amber { color: var(--amber); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; }

/* App shell */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.topbar { height: 3.2rem; flex: none; display: flex; align-items: center; gap: 1.2rem; padding: 0 1.6rem; border-bottom: 1px solid var(--line); }
.topbar .brand { display: flex; align-items: center; gap: 0.8rem; }
.topbar .brand .logo-crop { width: 2.2rem; height: 2.2rem; }
.topbar .sep { width: 1px; height: 1.4rem; background: var(--line); }
.topbar .status { margin-left: auto; display: flex; gap: 2rem; align-items: center; font-family: var(--mono); font-size: 1.1rem; }
.screens { position: relative; flex: 1; min-height: 0; }
.screen { position: absolute; inset: 0; padding: 1.4rem 1.6rem; opacity: 0; visibility: hidden; transition: opacity 120ms linear, visibility 0s linear 120ms; display: flex; flex-direction: column; min-height: 0; }
.screen.active { opacity: 1; visibility: visible; transition: opacity 120ms linear, visibility 0s; }

/* Logo: the source image is square with wide margins, so it is cropped here */
.logo-crop { position: relative; overflow: hidden; flex: none; }
.logo-crop img { position: absolute; width: 156%; left: -27.3%; top: -30.9%; max-width: none; }
/* Soft mask so the logo's own background vignette never shows as a box edge. */
.logo-crop { -webkit-mask-image: radial-gradient(closest-side, #000 88%, transparent 100%); mask-image: radial-gradient(closest-side, #000 88%, transparent 100%); }
/* Mark only (no wordmark), for small sizes */
.logo-mark { -webkit-mask-image: none; mask-image: none; }
.logo-crop.logo-mark img { width: 420%; left: -160%; top: -123.8%; }

/* Buttons: big hit areas, hairline borders */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; min-height: 3.2rem; padding: 0 1.4rem; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; cursor: pointer; font-family: var(--mono); font-size: 1.15rem; letter-spacing: 0.04em; transition: background 80ms linear, border-color 80ms linear; }
.btn:hover { background: var(--panel-2); border-color: var(--muted); }
.btn.primary, .btn:focus-visible { border-color: var(--amber); outline: none; }
.btn.primary { color: var(--amber); }
.btn .key { font-size: 0.8rem; color: var(--muted); border: 1px solid var(--line); padding: 0.05rem 0.4rem; border-radius: 2px; }
.btn.buy.on { background: rgba(63,185,107,0.16); border-color: var(--green); color: var(--green); }
.btn.sell.on { background: rgba(229,83,75,0.16); border-color: var(--red); color: var(--red); }
.btn.flat.on { background: var(--panel-2); border-color: var(--text); }

/* Attract */
.attract { display: grid; grid-template-columns: 1fr 1.05fr; grid-template-rows: 1fr auto; gap: 1.2rem 3rem; }
.attract .left { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.attract .left .logo-crop { width: 10.5rem; height: 10.5rem; margin-bottom: 0.4rem; margin-left: -0.6rem; }
.attract h1 { font-size: 3.6rem; line-height: 1.05; margin: 0.6rem 0 0.8rem; font-weight: 600; letter-spacing: -0.01em; }
.attract .pitch { font-size: 1.6rem; color: var(--text); margin: 0 0 2rem; max-width: 30rem; }
.attract .cta { align-self: flex-start; font-size: 1.5rem; min-height: 4.2rem; padding: 0 2rem; }
.attract .others { margin-top: 1.4rem; font-size: 1rem; color: var(--muted); }
.attract .others b { color: var(--text); font-weight: 600; }
.attract .right { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.attract .ticker { grid-column: 1 / -1; height: 7rem; border-top: 1px solid var(--line); position: relative; }
.attract .ticker canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cta-blink { animation: none; }

/* Leaderboard tables */
table.data { width: 100%; border-collapse: collapse; font-size: 1.15rem; }
table.data th { font-family: var(--sans); font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--line); }
table.data th.num { text-align: right; }
table.data td { padding: 0.36rem 0.7rem; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
table.data td.name { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; max-width: 12rem; }
table.data td.rank { color: var(--muted); width: 3rem; }
table.data tr.me td { background: rgba(240,168,48,0.10); }
table.data tr.me td.rank { color: var(--amber); }
table.data tr.empty td { color: var(--dim); }
.lb-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem; }

/* How to play */
.howto { justify-content: center; align-items: center; }
.howto .box { width: min(54rem, 100%); padding: 2.4rem 2.8rem; }
.howto h2 { font-size: 2.4rem; margin: 0.4rem 0 1.4rem; font-weight: 600; }
.howto ol { margin: 0 0 1.6rem; padding: 0; list-style: none; counter-reset: s; }
.howto li { counter-increment: s; font-size: 1.55rem; margin: 0 0 0.9rem; padding-left: 2.6rem; position: relative; }
.howto li::before { content: counter(s); position: absolute; left: 0; top: 0.1rem; font-family: var(--mono); font-size: 1.1rem; color: var(--muted); border: 1px solid var(--line); width: 1.8rem; text-align: center; }
.howto .example { border-left: 2px solid var(--line); padding: 0.6rem 1.2rem; font-size: 1.3rem; color: var(--muted); margin-bottom: 2rem; }
.howto .example .label { display: block; margin-bottom: 0.3rem; }
.howto .example b { color: var(--text); font-weight: 600; }

/* Countdown overlay */
.countdown { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
.countdown span { font-family: var(--mono); font-size: 9rem; color: var(--amber); background: var(--bg); border: 1px solid var(--line); padding: 0 3rem; border-radius: 2px; }

/* Results */
.results { display: grid; grid-template-columns: 1fr 25rem; gap: 2rem; }
.results .detail { min-height: 0; display: flex; flex-direction: column; }
.results .side { display: flex; flex-direction: column; gap: 1rem; min-height: 0; }
.results .score-big { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 3.6rem; line-height: 1; margin-top: 0.3rem; }
.results .rank-line { font-size: 1.2rem; min-height: 1.6rem; }
.results .rank-line.hi { color: var(--amber); font-weight: 600; }
.nick { display: flex; gap: 0.6rem; }
.nick input { flex: 1; min-width: 0; height: 3.2rem; background: var(--bg); border: 1px solid var(--amber); border-radius: 2px; padding: 0 0.9rem; font-family: var(--mono); font-size: 1.4rem; outline: none; user-select: text; }
.nick input::placeholder { color: var(--dim); }
.nick-msg { font-size: 1rem; color: var(--muted); min-height: 1.3rem; }
.takeaway { font-size: 1.2rem; border-left: 2px solid var(--line); padding-left: 1rem; }
.qr { display: flex; gap: 1rem; align-items: center; margin-top: auto; }
.qr img { width: 9.5rem; height: 9.5rem; image-rendering: pixelated; border-radius: 0; flex: none; }
.qr .cap { font-size: 1.05rem; color: var(--text); }
.qr .cap .label { display: block; margin-bottom: 0.3rem; }
.seed { font-family: var(--mono); font-size: 0.75rem; color: var(--dim); }

/* Charts */
.chartbox { position: relative; min-height: 0; }
.chartbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.timebar { height: 0.35rem; background: var(--line-soft); position: relative; overflow: hidden; }
.timebar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--amber); width: 100%; }
.kv { display: flex; flex-direction: column; gap: 0.1rem; }
.kv .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 1.9rem; line-height: 1.15; }
.k { font-family: var(--mono); font-size: 0.85em; border: 1px solid var(--line); padding: 0 0.35rem; margin: 0 0.1rem; color: var(--muted); border-radius: 2px; white-space: nowrap; }
.btn.big { min-height: 4.4rem; font-size: 1.6rem; letter-spacing: 0.08em; }

.g2 { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.8rem; }
.g2-head { display: grid; grid-template-columns: 10rem 1fr 10rem; align-items: end; }
.g2-head .right { text-align: right; }
.g2-head .v { font-size: 2.4rem; }
.g2-prompt { text-align: center; font-size: 2rem; font-weight: 600; padding-bottom: 0.2rem; }
.g2-pair { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
.g2-card { position: relative; display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--bg); cursor: pointer; border-radius: 2px; transition: border-color 80ms linear, background 80ms linear; }
.g2-card:hover { border-color: var(--muted); }
.g2-card .chartbox { flex: 1; }
.g2-cap { height: 4rem; padding: 0 1rem; display: flex; flex-direction: column; justify-content: center; border-top: 1px solid var(--line-soft); }
.g2-name { font-size: 1.5rem; font-weight: 600; min-height: 1.9rem; }
.g2-meta { font-size: 1rem; color: var(--muted); font-family: var(--mono); min-height: 1.3rem; }
.g2-key { position: absolute; top: 0.6rem; left: 0.8rem; font-family: var(--mono); font-size: 1rem; color: var(--muted); }
.g2-card[data-side="1"] .g2-key { left: auto; right: 0.8rem; }
.g2-card.is-fake .g2-name { color: var(--muted); }
.g2-card.chose-ok { border-color: var(--green); background: rgba(63,185,107,0.08); outline: 1px solid var(--green); }
.g2-card.chose-bad { border-color: var(--red); background: rgba(229,83,75,0.08); outline: 1px solid var(--red); }
.g2-verdict { height: 2.2rem; text-align: center; font-family: var(--mono); font-size: 1.5rem; }
.g2-res td.sans { font-family: var(--sans); }
.g2-res td { padding-top: 0.42rem; padding-bottom: 0.42rem; }
.g2-note { margin-top: 1rem; font-size: 1rem; }

/* Phone layer (docs/ build only). Loaded after base.css and each game's game.css.
   The laptop build scales rem with the viewport; phones use a fixed, readable rem instead. */
html { font-size: clamp(14px, 4.1vw, 17px); }
html, body { overscroll-behavior: none; }
body.m { font-size: 1rem; -webkit-tap-highlight-color: transparent; }
.m .key, .m .g2-key, .m .g4-keys { display: none; }
.m .btn { min-height: 3rem; touch-action: manipulation; font-size: 1rem; padding: 0 0.9rem; }
.m .btn.big { min-height: 3.6rem; font-size: 1.15rem; }
.m a.btn { text-decoration: none; color: var(--text); }
.m a.btn.primary { color: var(--amber); }

/* Top bar: mark, game name, back link */
.m .topbar { height: 3.2rem; padding: 0 0.9rem; gap: 0.7rem; }
.m .topbar .brand .logo-crop { width: 2rem; height: 2rem; }
.m .m-title { color: var(--text); letter-spacing: 0.14em; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m .m-back { margin-left: auto; color: var(--text); font-size: 0.9rem; text-decoration: none; border: 1px solid var(--line); border-radius: 2px; padding: 0 0.8rem; min-height: 2.75rem; display: inline-flex; align-items: center; white-space: nowrap; touch-action: manipulation; }

/* Screens: the game screen never scrolls; how-to and results scroll naturally if needed */
.m .screen { padding: 0.8rem 0.9rem; }
.m .screen.howto, .m .screen.results { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.m .screen.game { overflow: hidden; touch-action: manipulation; }
.m .countdown span { font-size: 6rem; padding: 0 2rem; }

/* How to play */
.m .howto { justify-content: flex-start; align-items: stretch; }
.m .howto .box { width: 100%; padding: 0.4rem 0 1rem; }
.m .howto h2 { font-size: 1.9rem; margin: 0.3rem 0 1rem; }
.m .howto li { font-size: 1.1rem; padding-left: 2.1rem; margin-bottom: 0.8rem; }
.m .howto li::before { font-size: 0.85rem; width: 1.5rem; }
.m .howto .example { font-size: 1rem; margin-bottom: 1.3rem; }
.m .m-start { width: 100%; }

/* Results: stacked, current result first */
.m .results { display: flex; flex-direction: column; gap: 0.9rem; }
.m .m-card { border: 1px solid var(--line); background: var(--panel); padding: 0.9rem 1rem; border-radius: 2px; }
.m .m-game { color: var(--text); margin-bottom: 0.6rem; }
.m .results .score-big { font-size: 3rem; margin-top: 0.2rem; }
.m .m-sub { margin-top: 0.3rem; font-size: 1rem; }
.m .m-finished { margin-top: 0.6rem; font-size: 1.1rem; color: var(--text); border-top: 1px solid var(--line-soft); padding-top: 0.6rem; }
.m .m-prize { border: 1px solid var(--amber); color: var(--text); padding: 0.8rem 1rem; font-size: 1.05rem; border-radius: 2px; }
.m .m-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
.m .takeaway { font-size: 1.05rem; }
.m .m-join { width: 100%; color: var(--text); }
.m .results .detail { display: block; padding-top: 0.4rem; border-top: 1px solid var(--line); }
.m .results .detail .chartbox { height: 15rem; flex: none !important; }
.m table.data { font-size: 0.9rem; }
.m table.data th { font-size: 0.65rem; letter-spacing: 0.12em; padding: 0.4rem 0.35rem; }
.m table.data td { padding: 0.35rem; white-space: normal; }
.m table.data td.num { white-space: nowrap; }

/* Shared in-game bits */
.m .kv .v { font-size: 1.5rem; }
.m .label { font-size: 0.7rem; letter-spacing: 0.16em; }

/* Phone held sideways: short screens get the laptop-style side-by-side layouts, compacted.
   The game screen may scroll as a last resort so no control is ever unreachable. */
@media (orientation: landscape) and (max-height: 520px) {
  html { font-size: clamp(12px, 3.4vh, 15px); }
  .m .topbar { height: 2.8rem; }
  .m .m-back { min-height: 2.4rem; }
  .m .screen { padding: 0.5rem 0.9rem; }
  .m .screen.game { overflow-y: auto; }
}

/* Phone layout: the two charts stack; each whole card is the tap target. */
.m .g2 { gap: 0.5rem; }
.m .g2-head { grid-template-columns: 4.5rem 1fr 4.5rem; }
.m .g2-head .v { font-size: 1.5rem; }
.m .g2-prompt { font-size: 1.25rem; }
.m .g2-pair { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 0.6rem; }
.m .g2-card { touch-action: manipulation; }
.m .g2-card:not(.is-real):not(.is-fake) .g2-cap::before { content: "Tap if real"; color: var(--dim); font-family: var(--mono); font-size: 0.95rem; }
.m .g2-card:not(.is-real):not(.is-fake) .g2-name, .m .g2-card:not(.is-real):not(.is-fake) .g2-meta { display: none; }
.m .g2-cap { height: 3.3rem; padding: 0 0.8rem; }
.m .g2-name { font-size: 1.15rem; min-height: 1.5rem; }
.m .g2-meta { font-size: 0.8rem; }
.m .g2-card.chose-ok, .m .g2-card.chose-bad { outline-width: 3px; outline-offset: -1px; }
.m .g2-verdict { height: auto; min-height: 1.6rem; font-size: 1.05rem; }
.m .g2-res th:nth-child(3), .m .g2-res td:nth-child(3),
.m .g2-res th:nth-child(4), .m .g2-res td:nth-child(4),
.m .g2-res th:nth-child(6), .m .g2-res td:nth-child(6) { display: none; }
.m .g2-note { font-size: 0.9rem; }
@media (orientation: landscape) and (max-height: 520px) {
  .m .g2-pair { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  .m .g2-cap { height: 2.8rem; }
  .m .g2-prompt { font-size: 1.1rem; }
}

</style>
</head>

    function show(name) {
      app.state = name;
      document.body.dataset.screen = name;
      for (const k in screens) screens[k].classList.toggle('active', k === name);
      screens[name].scrollTop = 0;
    }

    let cdTimer = 0, cdEl = null;
    function clearCountdown() { clearInterval(cdTimer); cdTimer = 0; if (cdEl) { cdEl.remove(); cdEl = null; } }
    function startGame() {
      if (spec.game.stopResults) spec.game.stopResults();
      clearCountdown();
      show('game');
      // Always a fresh seed: prize scores must not be replayable from the URL.
      app.seed = root.ASRng.newSeed();
      const ctx = { seed: app.seed, rng: root.ASRng.makeRng(app.seed), config: CFG, finish, status: () => {} };
      if (spec.game.prepare) spec.game.prepare(ctx);
      const n = spec.countdown || 0;
      if (!n) { spec.game.start(ctx); return; }
      let k = n;
      cdEl = document.createElement('div');
      cdEl.className = 'countdown';
      cdEl.innerHTML = `<span>${k}</span>`;
      screens.game.appendChild(cdEl);
      cdTimer = setInterval(() => {
        k--;
        if (k <= 0) { clearCountdown(); if (app.state === 'game') spec.game.start(ctx); }
        else cdEl.firstChild.textContent = k;
      }, CFG.COUNTDOWN_STEP_MS || 700);
    }

    function finish(result) {
      if (app.state !== 'game') return;
      $('#res-score').innerHTML = `<span class="${result.scoreClass != null ? result.scoreClass : AS.fmt.cls(result.score)}">${esc(result.scoreText)}</span>`;
      $('#res-sub').innerHTML = result.subHtml || '';
      $('#res-time').textContent = 'Finished at ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      $('#res-takeaway').textContent = result.takeaway;
      show('results');
      spec.game.renderResults($('#res-detail'), result);
    }

    $('#btn-start').addEventListener('click', () => { if (app.state === 'howto') startGame(); });
    $('#btn-again').addEventListener('click', () => { if (app.state === 'results') startGame(); });

    // Keyboard stays optional: Enter/Space start, arrows etc. go to the game.
    root.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const k = e.key;
      if (app.state === 'howto' && (k === ' ' || k === 'Enter') && !e.repeat && document.activeElement.tagName !== 'A') { e.preventDefault(); startGame(); return; }
      if (app.state === 'game') {
        if (cdEl) return;
        if (spec.game.onKey(e) || [' ', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
      }
    }, true);

    show('howto');
    return app;
  }

  AS.createMobileApp = createMobileApp;
})(this);

/* ---- games/real-or-random/game.js ---- */
/* Game 2: Real or Random. */
(function () {
  'use strict';
  /*CONFIG*/
  const CONFIG = AS.config({
    IDLE_SECONDS: 25,
    COUNTDOWN_SECONDS: 3,
    ROUNDS: 10,
    ROUND_SECONDS: 6,
    VERDICT_MS: 1200,
    POINTS_CORRECT: 100,
    SPEED_BONUS_MAX: 50,     // scales linearly from 50 at 0 s to 0 at ROUND_SECONDS
    TEXT: {
      title: 'Real or Random',
      pitch: 'One chart is a real market. One is random. Can you tell?',
      howto: [
        'Two charts appear. One is 120 days of a real market, the other is random.',
        'Pick the real one: click it, or press <span class="k">←</span> or <span class="k">→</span>.',
        '10 rounds, 6 seconds each. Faster correct answers score more.',
      ],
      howtoMobile: [
        'Two charts appear. One is 120 days of a real market, the other is random.',
        'Tap the one you think is real.',
        '10 rounds, 6 seconds each. Faster correct answers score more.',
      ],
      example: 'Real prices move in bursts: quiet weeks, then sudden jumps. A correct answer in 2 seconds scores <b>100 + 33 = 133</b>.',
      prompt: 'Which one is real?',
      randomName: 'Random walk',
      timeout: 'Too slow',
      takeaway: 'Real prices have fat tails and volatility that clusters. Week 2 teaches you to measure both.',
    },
  });
  /*END CONFIG*/

  const Ch = ASChart, fmt = AS.fmt;
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const ukDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };

  let el, ctx, rounds, idx, score, correct, phase, roundStart, timer, stopLoop, history;

  const html = `
    <div class="g2">
      <div class="g2-head">
        <div class="kv"><span class="label">Round</span><span class="v" id="g2-round">1/10</span></div>
        <div class="g2-prompt" id="g2-prompt">${CONFIG.TEXT.prompt}</div>
        <div class="kv right"><span class="label">Score</span><span class="v" id="g2-score">0</span></div>
      </div>
      <div class="timebar"><i id="g2-bar"></i></div>
      <div class="g2-pair">
        <div class="g2-card" data-side="0">
          <div class="chartbox"><canvas></canvas></div>
          <div class="g2-cap"><span class="g2-name"></span><span class="g2-meta"></span></div>
          <div class="g2-key"><span class="k">←</span> Left</div>
        </div>
        <div class="g2-card" data-side="1">
          <div class="chartbox"><canvas></canvas></div>
          <div class="g2-cap"><span class="g2-name"></span><span class="g2-meta"></span></div>
          <div class="g2-key">Right <span class="k">→</span></div>
        </div>
      </div>
      <div class="g2-verdict" id="g2-verdict">&nbsp;</div>
    </div>`;

  function mount(root) {
    el = root;
    el.querySelectorAll('.g2-card').forEach((c) => c.addEventListener('pointerdown', (e) => { e.preventDefault(); answer(+c.dataset.side); }));
  }

  function logReturnsSd(closes) {
    const r = [];
    for (let i = 1; i < closes.length; i++) r.push(Math.log(closes[i] / closes[i - 1]));
    const m = r.reduce((a, b) => a + b, 0) / r.length;
    return Math.sqrt(r.reduce((a, b) => a + (b - m) * (b - m), 0) / (r.length - 1));
  }

  function prepare(c) {
    ctx = c;
    const rng = c.rng;
    const P = window.PRICES;
    const order = rng.shuffle(P.map((_, i) => i)).slice(0, CONFIG.ROUNDS);
    rounds = order.map((i) => {
      const real = P[i].closes;
      const sd = logReturnsSd(real);
      const fake = [real[0]];
      let x = Math.log(real[0]);
      for (let t = 1; t < real.length; t++) { x += sd * rng.normal(); fake.push(Math.exp(x)); }
      const realSide = rng.next() < 0.5 ? 0 : 1;
      return { meta: P[i], realSide, series: realSide === 0 ? [real, fake] : [fake, real] };
    });
    idx = 0; score = 0; correct = 0; history = []; phase = 'wait';
    setRound();
    if (!stopLoop) stopLoop = Ch.loop(draw);
  }

  function start() { beginRound(); }

  function setRound() {
    const r = rounds[idx];
    document.getElementById('g2-round').textContent = `${idx + 1}/${CONFIG.ROUNDS}`;
    document.getElementById('g2-score').textContent = score;
    const v = document.getElementById('g2-verdict');
    v.innerHTML = '&nbsp;'; v.className = 'g2-verdict';
    document.getElementById('g2-bar').style.width = '100%';
    el.querySelectorAll('.g2-card').forEach((c) => { c.className = 'g2-card'; c.querySelector('.g2-name').textContent = ''; c.querySelector('.g2-meta').textContent = ''; });
    r.shown = true;
  }

  function beginRound() {
    phase = 'ask';
    roundStart = performance.now();
    clearInterval(timer);
    timer = setInterval(() => {
      const t = (performance.now() - roundStart) / 1000;
      document.getElementById('g2-bar').style.width = Math.max(0, 100 * (1 - t / CONFIG.ROUND_SECONDS)) + '%';
      if (t >= CONFIG.ROUND_SECONDS) answer(null);
    }, 30);
  }

  function answer(side) {
    if (phase !== 'ask') return;
    phase = 'verdict';
    clearInterval(timer);
    const r = rounds[idx];
    const t = Math.min(CONFIG.ROUND_SECONDS, (performance.now() - roundStart) / 1000);
    const ok = side === r.realSide;
    const bonus = ok ? Math.round(CONFIG.SPEED_BONUS_MAX * Math.max(0, 1 - t / CONFIG.ROUND_SECONDS)) : 0;
    const pts = ok ? CONFIG.POINTS_CORRECT + bonus : 0;
    score += pts; if (ok) correct++;
    history.push({ meta: r.meta, ok, timeout: side === null, pts, t });
    document.getElementById('g2-score').textContent = score;
    const cards = el.querySelectorAll('.g2-card');
    cards.forEach((c, i) => {
      const isReal = i === r.realSide;
      c.querySelector('.g2-name').textContent = isReal ? r.meta.name : CONFIG.TEXT.randomName;
      c.querySelector('.g2-meta').textContent = isReal ? `${r.meta.asset_class} · from ${ukDate(r.meta.start_date)}` : 'Generated with the same volatility';
      c.classList.add(isReal ? 'is-real' : 'is-fake');
      if (i === side) c.classList.add(ok ? 'chose-ok' : 'chose-bad');
    });
    const v = document.getElementById('g2-verdict');
    if (side === null) { v.textContent = `${CONFIG.TEXT.timeout}. The real one was ${r.meta.name}.`; v.className = 'g2-verdict neg'; }
    else if (ok) { v.textContent = `Correct · +${CONFIG.POINTS_CORRECT} · +${bonus} speed`; v.className = 'g2-verdict pos'; }
    else { v.textContent = `Wrong. The real one was ${r.meta.name}.`; v.className = 'g2-verdict neg'; }
    timer = setTimeout(next, CONFIG.VERDICT_MS);
  }

  function next() {
    idx++;
    if (idx >= CONFIG.ROUNDS) return end();
    setRound();
    beginRound();
  }

  function onKey(e) {
    if (e.repeat) return true;
    if (e.key === 'ArrowLeft') { answer(0); return true; }
    if (e.key === 'ArrowRight') { answer(1); return true; }
    return false;
  }

  function end() {
    phase = 'done';
    ctx.finish({
      score,
      scoreText: String(score),
      scoreClass: '',
      subHtml: `${correct}/${CONFIG.ROUNDS} correct`,
      takeaway: CONFIG.TEXT.takeaway,
      entry: { correct },
      history: history.slice(),
    });
  }

  function stop() { clearInterval(timer); clearTimeout(timer); phase = 'done'; }

  function draw() {
    if (!rounds || document.body.dataset.screen !== 'game') return;
    const r = rounds[idx];
    if (!r) return;
    el.querySelectorAll('.g2-card canvas').forEach((cv, i) => {
      const s = r.series[i];
      const g = Ch.fit(cv);
      const rem = g.rem;
      const box = { x0: 0.8 * rem, x1: g.w - 0.8 * rem, y0: 0.8 * rem, y1: g.h - 0.8 * rem };
      const [lo, hi] = Ch.pad(Ch.extent([s]), 0.06);
      const xs = Ch.scale(0, s.length - 1, box.x0, box.x1);
      const ys = Ch.scale(lo, hi, box.y1, box.y0);
      Ch.grid(g, box, ys, lo, hi, { count: 5, labels: false });
      Ch.series(g, s, 0, s.length, xs, ys, Ch.C.text, 1.8);
    });
  }

  function renderResults(root, r) {
    let rows = '';
    r.history.forEach((h, i) => {
      const verdict = h.ok ? '<span class="pos">correct</span>' : h.timeout ? '<span class="neg">too slow</span>' : '<span class="neg">wrong</span>';
      rows += `<tr><td class="num rank">${i + 1}</td><td class="sans">${AS.esc(h.meta.name)}</td><td class="sans muted">${h.meta.asset_class}</td><td class="num">${ukDate(h.meta.start_date)}</td><td class="num">${verdict}</td><td class="num">${h.ok ? h.t.toFixed(1) + 's' : '—'}</td><td class="num">${h.pts}</td></tr>`;
    });
    root.innerHTML = `
      <div class="label" style="margin-bottom:0.6rem">The real charts you saw</div>
      <table class="data g2-res">
        <thead><tr><th class="num">#</th><th>Market</th><th>Class</th><th class="num">Start</th><th class="num">Answer</th><th class="num">Time</th><th class="num">Points</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="g2-note muted">Every real chart is 120 trading days of daily closes. Each random chart had the same start price and daily volatility.</div>`;
  }

  AS.createApp({
    id: 'real-or-random', number: 2, title: CONFIG.TEXT.title, pitch: CONFIG.TEXT.pitch,
    howto: CONFIG.TEXT.howto, howtoMobile: CONFIG.TEXT.howtoMobile, example: CONFIG.TEXT.example, countdown: CONFIG.COUNTDOWN_SECONDS,
    scoreLabel: 'Your score', config: CONFIG, gameHtml: html,
    columns: [
      { key: 'score', label: 'Score', fmt: (v) => String(v) },
      { key: 'correct', label: 'Correct', fmt: (v) => `${v}/10` },
    ],
    game: { mount, prepare, start, stop, onKey, renderResults },
  });
})();

</script>
